server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream$request_uri;
    }
}
