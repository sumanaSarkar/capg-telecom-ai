services:
  backend:
    build: ./backend
    ports: ["3001:3001"]
    environment:
      - JWT_SECRET=${JWT_SECRET:-please-set-a-secure-jwt-secret}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_TRANSCRIPTION_MODEL=${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      - OPENAI_REALTIME_MODEL=${OPENAI_REALTIME_MODEL:-gpt-realtime-mini}
      - NODE_ENV=production
    networks: [telecom-net]
  frontend:
    build: ./frontend
    ports: ["4173:80"]
    depends_on: [backend]
    networks: [telecom-net]
networks:
  telecom-net:
